name: Build Keep Date Stamper APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Restore Fixed Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/fixed-debug.keystore"
            echo "FIXED_KEYSTORE_PATH=${{ runner.temp }}/fixed-debug.keystore" >> "$GITHUB_ENV"
            echo "Fixed debug keystore restored."
          else
            echo "DEBUG_KEYSTORE_BASE64 secret not found; falling back to ephemeral debug keystore."
          fi

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk KeepTarihDamgasi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepTarihDamgasi-APK
          path: KeepTarihDamgasi.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Keep Tarih Damgası APK (v1.2.0 - Çizgili Başlık & Hızlı Şablonlar)"
          files: KeepTarihDamgasi.apk
          overwrite: true
