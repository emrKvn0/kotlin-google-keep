name: Build Keep Date Stamper APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk KeepTarihDamgasi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepTarihDamgasi-APK
          path: KeepTarihDamgasi.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Keep Tarih Damgası APK (v1.0.0)"
          files: KeepTarihDamgasi.apk
          overwrite: true
